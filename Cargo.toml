[workspace]
resolver = "2"
members = [
    "services/relay",
    "services/admin",
    "services/gateway",
    "services/pinner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/damz/damz"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
tokio = { version = "1.39", features = ["full"] }
arti-client = "0.17"
tower-http = { version = "0.7", features = ["trace", "cors", "compression-br", "compression-deflate", "compression-gzip", "compression-zstd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde", "fast-rng"] }
sha2 = "0.10"
base64 = "0.22"
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
bytes = "1.5"
time = { version = "0.3", features = ["serde-human-readable", "formatting", "parsing"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
