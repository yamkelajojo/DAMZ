[package]
name = "damz-admin"
description = "Admin service for runner registry, strikes, disputes, and wipe commands"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
time = { workspace = true }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "macros"] }

# Tor
arti-client = { workspace = true }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Crypto
ed25519-dalek = { version = "2.1", features = ["digest"] }
x25519-dalek = "2.0"
rand = { version = "0.8", features = ["std"] }
argon2 = "0.5"
base64 = { version = "0.22", features = ["std"] }
bs58 = "0.4"